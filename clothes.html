<!DOCTYPE html>
<html>

<head>

<title>Clothes</title>

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>

body{
    margin:0;
    background:#f5f5f5;
    font-family:Arial;
}


.container{

    display:grid;
    grid-template-columns:repeat(2, 1fr);
    gap:15px;
    padding:15px;

}


.product img{

    width:100%;
    height:250px;
    object-fit:cover;
    border-radius:12px;
    box-shadow:0 3px 10px #ccc;

}


.product img:hover{

    transform:scale(1.03);

}


a{
    text-decoration:none;
}



/* For bigger screens */

@media(min-width:700px){

.container{

grid-template-columns:repeat(4,1fr);

}

}

</style>

</head>


<body>


<div class="container">


<a href="YOUR_AMAZON_LINK">

<div class="product">

<img src="shirt1.jpg">

</div>

</a>



<a href="YOUR_MEESHO_LINK">

<div class="product">

<img src="dress1.jpg">

</div>

</a>



<a href="YOUR_FLIPKART_LINK">

<div class="product">

<img src="jeans1.jpg">

</div>

</a>



<a href="YOUR_AMAZON_LINK">

<div class="product">

<img src="tshirt1.jpg">

</div>

</a>



</div>


</body>

</html>
