<!DOCTYPE html>
<html>
<head>

<title>Clothes</title>

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
body{
margin:0;
background:#f5f5f5;
}

.grid{
display:grid;
grid-template-columns:1fr 1fr;
gap:10px;
padding:10px;
}

.grid img{
width:100%;
height:250px;
object-fit:cover;
border-radius:10px;
}

a{
text-decoration:none;
}
</style>

</head>

<body>

<div class="grid" id="products"></div>


<script>

fetch("https://docs.google.com/spreadsheets/d/1vFDlAIrNyzzZ7OaUWnF_h4JklrNc6CjDhG--vCMnst0/gviz/tq")
.then(response => response.text())
.then(data => {

let json = JSON.parse(data.substring(47).slice(0,-2));

let rows = json.table.rows;

let output="";

rows.forEach(row => {

let category = row.c[0].v;
let image = row.c[1].v;
let link = row.c[2].v;


if(category=="clothes"){

output += `
<a href="${link}">
<img src="${image}">
</a>
`;

}

});

document.getElementById("products").innerHTML=output;

});

</script>

</body>
</html>
