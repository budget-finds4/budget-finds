<!DOCTYPE html>
<html>
<head>
<title>Budget Finds</title>

<style>

body{
    margin:0;
    font-family:Arial, sans-serif;
    background:#f2f2f2;
}

.header{
    background:linear-gradient(45deg,#ff6b6b,#ff9f43);
    color:white;
    padding:30px;
    text-align:center;
}

.header h1{
    font-size:35px;
    margin:0;
}

.header p{
    font-size:18px;
}

.container{
    display:flex;
    flex-wrap:wrap;
    justify-content:center;
    gap:20px;
    padding:30px;
}

.card{
    width:220px;
    height:140px;
    background:white;
    border-radius:15px;
    display:flex;
    align-items:center;
    justify-content:center;
    flex-direction:column;
    font-size:22px;
    box-shadow:0 5px 15px #ccc;
    transition:0.3s;
}

.card:hover{
    transform:translateY(-10px);
    box-shadow:0 10px 20px #999;
}

a{
    text-decoration:none;
    color:#333;
}

.icon{
    font-size:45px;
    margin-bottom:10px;
}

</style>

</head>

<body>

<div class="header">
<h1>🛍️ Budget Finds</h1>
<p>Best products at affordable prices</p>
</div>


<div class="container">

<a href="clothes.html">
<div class="card">
<div class="icon">👕</div>
Clothes
</div>
</a>


<a href="toys.html">
<div class="card">
<div class="icon">🧸</div>

</div>
</a>


<a href="kitchen.html">
<div class="card">
<div class="icon">🍳</div>
Kitchen
</div>
</a>


<a href="electronics.html">
<div class="card">
<div class="icon">📱</div>
Electronics
</div>
</a>


<a href="gifts.html">
<div class="card">
<div class="icon">🎁</div>
Gifts
</div>
</a>


<a href="household.html">
<div class="card">
<div class="icon">🏠</div>
Household
</div>
</a>


</div>

</body>
</html>
