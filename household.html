<!DOCTYPE html>
<html>
<head>

<title>Household - Budget Finds</title>

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>

body{
  margin:0;
  font-family:Arial;
  background:#f5f5f5;
}

.header{
  background:linear-gradient(90deg,#ff6b6b,#ffa94d);
  color:white;
  text-align:center;
  padding:20px;
}

.header h1{
  margin:0;
  font-size:24px;
}

.products{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:12px;
  padding:12px;
}

.product{
  background:white;
  border-radius:10px;
  overflow:hidden;
  box-shadow:0 2px 8px #ccc;
}

.product img{
  width:100%;
  height:220px;
  object-fit:cover;
}

</style>

</head>


<body>

<div class="header">
<h1>Household</h1>
</div>


<div class="products" id="products">

</div>



<script>

let sheetURL =
"https://docs.google.com/spreadsheets/d/1vFDlAIrNyzzZ7OaUWnF_h4JklrNc6CjDhG--vCMnst0/gviz/tq";


fetch(sheetURL)

.then(response => response.text())

.then(data => {


let json = JSON.parse(data.substring(47).slice(0,-2));


let rows = json.table.rows;


let output = "";



rows.forEach(row => {


let category = row.c[0]?.v;

let image = row.c[1]?.v;

let link = row.c[2]?.v;



if(category && category.toLowerCase()=="Household"){


output += `

<div class="product">

<a href="${link}" target="_blank">

<img src="${image}">

</a>

</div>

`;


}


});



document.getElementById("products").innerHTML = output;


});


</script>


</body>
</html>
